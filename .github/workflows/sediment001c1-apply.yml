name: sediment001c1-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'sediment/001c1-compressed-recovery-mass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sediment/001c1-compressed-recovery-mass
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply SEDIMENT-001C1
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/sand/mod.rs')
          source = path.read_text()
          old = 'mod engine;\n\n#[allow(unused_imports)]\npub use engine::{SandEngine, SandState, SandStateGrain};'
          new = 'mod engine;\n\npub use engine::{SandEngine, SandState, SandStateGrain};'
          if old not in source:
              raise SystemExit('sand module normalization anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
          python tools/sediment001c1-apply.py
          python - <<'PY'
          from pathlib import Path

          engine = Path('src/sand/engine.rs')
          source = engine.read_text()
          source = source.replace(
              '    pub fn pending_run_count(&self) -> usize {',
              '    #[cfg(test)]\n    fn pending_run_count(&self) -> usize {',
              1,
          )
          source = source.replace(
              'use super::{PendingGrainRun, SandEngine, SandState, SandStateGrain};',
              'use crate::sand::{PendingGrainRun, SandEngine, SandState, SandStateGrain};',
              1,
          )
          engine.write_text(source)

          module = Path('src/sand/mod.rs')
          source = module.read_text()
          old = (
              'mod engine;\nmod recovery;\n\n'
              'pub use engine::{PendingGrainRun, SandEngine, SandState, SandStateGrain};\n'
              'pub(crate) use recovery::{PeriodicAdvance, advance_periodic};'
          )
          new = (
              'mod engine;\n#[allow(dead_code)]\nmod recovery;\n\n'
              '#[allow(unused_imports)]\n'
              'pub use engine::{PendingGrainRun, SandEngine, SandState, SandStateGrain};'
          )
          if old not in source:
              raise SystemExit('compressed sand module output was not found')
          module.write_text(source.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Commit clean implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'SEDIMENT-001C1: compress pending recovery mass'
          git push origin HEAD:sediment/001c1-compressed-recovery-mass
