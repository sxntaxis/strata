name: sqlite-only-runtime

on:
  pull_request:
    paths:
      - '.github/workflows/sqlite-only-runtime.yml'
      - '.github/scripts/apply_sqlite_only_runtime.py'
      - '.github/scripts/apply_sqlite_only_cleanup.py'
      - 'tests/config_authority.rs'
      - 'tests/profile_authority.rs'
      - 'tests/temporal_authority.rs'

permissions:
  contents: write

concurrency:
  group: sqlite-only-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply SQLite-only runtime
        run: |
          python3 .github/scripts/apply_sqlite_only_runtime.py
          python3 .github/scripts/apply_sqlite_only_cleanup.py

      - name: Format
        run: cargo fmt --all

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Full suite
        run: cargo test --all-features

      - name: Publish clean product commit
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/scripts/apply_sqlite_only_runtime.py
          rm -f .github/scripts/apply_sqlite_only_cleanup.py
          rm -f .github/workflows/sqlite-only-runtime.yml
          rm -f .github/workflows/sqlite-only-inventory.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: make SQLite the only runtime authority'
          git push origin HEAD:$BRANCH
