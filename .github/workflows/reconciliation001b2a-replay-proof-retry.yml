name: reconciliation001b2a-replay-proof-retry

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  replay-proof:
    if: github.head_ref == 'reconciliation/001b2a-legacy-switch-receipts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/001b2a-legacy-switch-receipts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply replay proof refactor
        run: python tools/reconciliation001b2a-replay-proof.py
      - name: Remove test-only Debug bound
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app.rs')
          text = path.read_text()
          old = '''        let error = publish_legacy_switch_replay(
              &tracker,
              &[],
              &mut checkpoint,
              &receipt,
              &sessions_path,
              &categories_path,
              &checkpoint_path,
          )
          .unwrap_err();
          assert!(!error.is_empty());'''
          new = '''        let error = match publish_legacy_switch_replay(
              &tracker,
              &[],
              &mut checkpoint,
              &receipt,
              &sessions_path,
              &categories_path,
              &checkpoint_path,
          ) {
              Ok(_) => panic!("catalog publication unexpectedly succeeded"),
              Err(error) => error,
          };
          assert!(!error.is_empty());'''
          if old not in text:
              raise SystemExit('failure assertion anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/reconciliation001b2a-replay-proof-retry.yml
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit clean proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(reconciliation-001b2a): certify legacy switch replay kill points"
          git push origin HEAD:reconciliation/001b2a-legacy-switch-receipts
