name: reconciliation001b2c-docs

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  docs:
    if: github.head_ref == 'reconciliation/001b2c-clear-all-custody'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/001b2c-clear-all-custody
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Promote B2C authority
        run: python tools/reconciliation001b2c-docs.py
      - name: Remove temporary documentation machinery
        run: |
          rm -f tools/reconciliation001b2c-docs.py
          rm -f .github/workflows/reconciliation001b2c-docs.yml
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit accepted authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(reconciliation-001b2c): accept clear-all recovery authority"
          git push origin HEAD:reconciliation/001b2c-clear-all-custody
