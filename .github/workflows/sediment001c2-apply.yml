name: sediment001c2-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'sediment/001c2-bounded-checkpoint-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sediment/001c2-bounded-checkpoint-recovery
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply SEDIMENT-001C2
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/sediment001c2-apply.py')
          source = path.read_text()
          section = source.index('# Checkpoint schema and app lifecycle.')
          first = source.index('replace_once(', section)
          first_end = source.index('\n)\n', first) + 3
          second = source.index('replace_once(', first_end)
          second_end = source.index('\n)\n', second) + 3
          path.write_text(source[:second] + source[second_end:])
          PY
          python tools/sediment001c2-apply.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Commit clean implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'SEDIMENT-001C2: make checkpoint recovery bounded'
          git push origin HEAD:sediment/001c2-bounded-checkpoint-recovery
