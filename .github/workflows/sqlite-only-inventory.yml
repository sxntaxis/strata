name: sqlite-only-inventory

on:
  pull_request:
    paths:
      - '.github/workflows/sqlite-only-inventory.yml'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'notebook/**'

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory transitional authority surfaces
        run: |
          printf '%s\n' '=== files ==='
          find src tests docs notebook -type f | sort
          printf '%s\n' '=== matches ==='
          rg -n -i 'legacy|RuntimeAuthority|storage_authority|MigrateSqlite|ActivateSqlite|legacy_import_id|migrate-sqlite|activate-sqlite' src tests docs notebook || true
