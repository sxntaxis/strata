name: reconciliation001c2-ui

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: reconciliation001c2-ui
  cancel-in-progress: true

jobs:
  ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reconciliation/001c2-legacy-category-lifecycle
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Wire lifecycle interaction
        run: python tools/reconciliation001c2-ui.py

      - name: Remove temporary interaction machinery
        run: |
          rm -f tools/reconciliation001c2-ui.py
          rm -f .github/workflows/reconciliation001c2-ui.yml

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Commit clean interaction
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(category): add explicit lifecycle review and confirmation"
          git push origin HEAD:reconciliation/001c2-legacy-category-lifecycle
