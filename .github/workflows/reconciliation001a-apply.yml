name: reconciliation001a-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'reconciliation/001-legacy-category-integrity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/001-legacy-category-integrity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply RECONCILIATION-001A
        run: |
          python tools/reconciliation001a-prep.py
          python tools/reconciliation001a-apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path("src/sqlite/tui_runtime.rs")
          text = path.read_text()
          old = '''        loaded_categories: LoadedCategories {
              categories: active_categories,
              next_category_id: max_category_id.saturating_add(1).max(1),
          },
          loaded_sessions: LoadedSessions {
          '''
          new = '''        loaded_categories: LoadedCategories {
              categories: active_categories,
              archived_categories: archived_categories.clone(),
              next_category_id: max_category_id.saturating_add(1).max(1),
          },
          loaded_sessions: LoadedSessions {
          '''
          if old not in text:
              raise SystemExit("SQLite TUI category constructor was not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation-001a): preserve legacy category history"
          git push origin HEAD:reconciliation/001-legacy-category-integrity
