name: sediment001b-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'sediment/001b-logical-viewport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sediment/001b-logical-viewport
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply SEDIMENT-001B
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/sediment001b-apply.py')
          needle = chr(92) + 'u{2800}'
          path.write_text(path.read_text().replace(needle, '⠀'))
          PY
          python tools/sediment001b-apply.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Commit clean implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'SEDIMENT-001B: separate logical canvas from viewport'
          git push origin HEAD:sediment/001b-logical-viewport
