name: sediment001b-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'sediment/001b-logical-viewport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sediment/001b-logical-viewport
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply SEDIMENT-001B
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('tools/sediment001b-apply.py')
          needle = chr(92) + 'u{2800}'
          script.write_text(script.read_text().replace(needle, '⠀'))

          render = Path('src/app/render_views.rs')
          source = render.read_text()
          compact = (
              '        if self.sand_engine.grid_width_dots != inner_width * SAND_ENGINE.dot_width as u16\n'
              '            || self.sand_engine.grid_height_dots != inner_height * SAND_ENGINE.dot_height as u16'
          )
          normalized = (
              '        if self.sand_engine.grid_width_dots != inner_width * SAND_ENGINE.dot_width as u16\n'
              '            || self.sand_engine.grid_height_dots\n'
              '                != inner_height * SAND_ENGINE.dot_height as u16'
          )
          if compact not in source:
              raise SystemExit('render resize anchor was not found')
          render.write_text(source.replace(compact, normalized, 1))
          PY
          python tools/sediment001b-apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app.rs')
          source = path.read_text()
          old = '        RUNTIME_LOOP_SETTINGS, SAND_ENGINE, TIME_SETTINGS,\n'
          new = '        RUNTIME_LOOP_SETTINGS, TIME_SETTINGS,\n'
          if old not in source:
              raise SystemExit('obsolete SAND_ENGINE import was not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Commit clean implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'SEDIMENT-001B: separate logical canvas from viewport'
          git push origin HEAD:sediment/001b-logical-viewport
