name: sqlite008-assemble

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: storage/008-runtime-coordination-recovery
          fetch-depth: 0

      - name: Apply runtime coordination and recovery contracts
        run: |
          if ! test -f src/sqlite/runtime_coordination.rs; then
            python3 tools/sqlite008_schema_runtime.py
            python3 tools/sqlite008_tui_recovery.py
          fi
          if grep -q 'Some(state)' src/sqlite/tui_runtime.rs; then
            python3 tools/sqlite008_fix_compile.py
          fi
          python3 tools/sqlite008_refine.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format and certify
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

      - name: Commit certified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "SQLITE-008: preserve session deletion and retry receipts"
          git push origin HEAD:storage/008-runtime-coordination-recovery
