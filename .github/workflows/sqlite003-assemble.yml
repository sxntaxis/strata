name: sqlite003-assemble

on:
  push:
    branches:
      - storage/003-controlled-migration-command
    paths:
      - .tmp/sqlite003.partaa
      - .tmp/sqlite003.partaa1
      - .tmp/sqlite003.partaa2
      - .tmp/sqlite003.partab
      - .tmp/sqlite003.partac
      - .tmp/sqlite003.partad
      - .tmp/sqlite003.partae
      - .github/workflows/sqlite003-assemble.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: storage/003-controlled-migration-command
          fetch-depth: 0

      - name: Assemble controlled migration module
        run: |
          cat \
            .tmp/sqlite003.partaa1 \
            .tmp/sqlite003.partaa2 \
            .tmp/sqlite003.partab \
            .tmp/sqlite003.partac \
            .tmp/sqlite003.partad \
            .tmp/sqlite003.partae \
            > /tmp/sqlite003.b64
          base64 --decode /tmp/sqlite003.b64 > src/sqlite/migration_command.rs

      - name: Wire SQLite module and CLI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sqlite = Path('src/sqlite.rs')
          text = sqlite.read_text()
          old = 'mod legacy_import;\n'
          new = '''mod legacy_import;
          mod migration_command;

          pub(crate) use migration_command::{
              ControlledMigrationOptions, ControlledMigrationReport, run_controlled_migration,
          };
          '''
          if old not in text:
              raise SystemExit('sqlite module insertion point not found')
          sqlite.write_text(text.replace(old, new, 1))

          cli = Path('src/cli.rs')
          text = cli.read_text()
          old_import = '''use crate::{
              constants::COLORS,
              domain::{
                  CategoryId, DRIFT_CATEGORY_CONFIG_NAME, ReportPeriod, Session, build_period_report,
                  operational_day_key_for_local,
              },
              storage,
          };
          '''
          new_import = '''use crate::{
              constants::COLORS,
              domain::{
                  CategoryId, DRIFT_CATEGORY_CONFIG_NAME, DayBoundaryMode, ReportPeriod, Session,
                  build_period_report, operational_day_key_for_local, runtime_settings,
              },
              sqlite, storage,
          };
          '''
          if old_import not in text:
              raise SystemExit('cli import block not found')
          text = text.replace(old_import, new_import, 1)

          variant_anchor = '''    #[command(about = "Generate shell completions")]
              Completions {
          '''
          variant = '''    #[command(about = "Validate and publish a verified SQLite migration candidate")]
              MigrateSqlite {
                  #[arg(long, help = "Validate without creating backups, reports, markers, or a database")]
                  dry_run: bool,

                  #[arg(
                      long,
                      help = "Explicitly include an active or detached recovery interval"
                  )]
                  include_active_recovery: bool,

                  #[arg(long, value_name = "PATH", help = "SQLite candidate output path")]
                  database: Option<PathBuf>,

                  #[arg(long, value_name = "PATH", help = "Machine-readable migration report path")]
                  report_out: Option<PathBuf>,

                  #[arg(
                      long,
                      value_name = "SECONDS",
                      help = "Fixed UTC offset used to reconstruct legacy wall-clock timestamps"
                  )]
                  utc_offset_seconds: Option<i32>,

                  #[arg(
                      long,
                      value_name = "MINUTES",
                      help = "Operational-day start as minutes after midnight"
                  )]
                  day_start_minutes: Option<u16>,

                  #[arg(
                      long,
                      default_value_t = 1,
                      value_name = "SECONDS",
                      help = "Seconds represented by one sediment quantum"
                  )]
                  quantum_seconds: i64,

                  #[arg(long, help = "Print the migration result as JSON")]
                  json: bool,
              },

              #[command(about = "Generate shell completions")]
              Completions {
          '''
          if variant_anchor not in text:
              raise SystemExit('cli enum insertion point not found')
          text = text.replace(variant_anchor, variant, 1)

          function_anchor = 'pub fn print_completions(shell: &str) -> Result<(), String> {'
          function = '''#[allow(clippy::too_many_arguments)]
          pub fn migrate_sqlite(
              dry_run: bool,
              include_active_recovery: bool,
              database: Option<PathBuf>,
              report_out: Option<PathBuf>,
              utc_offset_seconds: Option<i32>,
              day_start_minutes: Option<u16>,
              quantum_seconds: i64,
              json: bool,
          ) -> Result<(), String> {
              if dry_run && report_out.is_some() {
                  return Err(
                      "--report-out cannot be used with --dry-run; use --json for a machine-readable preview"
                          .to_string(),
                  );
              }

              let settings = runtime_settings();
              let resolved_day_start = match day_start_minutes {
                  Some(value) => value,
                  None => match settings.day_boundary.mode {
                      DayBoundaryMode::FixedHour => {
                          let minutes = settings
                              .day_boundary
                              .fixed_hour
                              .checked_mul(60)
                              .and_then(|value| value.checked_add(settings.day_boundary.fixed_minute))
                              .ok_or_else(|| "Configured operational-day boundary overflows".to_string())?;
                          u16::try_from(minutes)
                              .map_err(|_| "Configured operational-day boundary is invalid".to_string())?
                      }
                      DayBoundaryMode::Sunrise => {
                          return Err(
                              "Sunrise day boundaries require explicit --day-start-minutes for migration"
                                  .to_string(),
                          );
                      }
                  },
              };

              let report = sqlite::run_controlled_migration(sqlite::ControlledMigrationOptions {
                  dry_run,
                  include_active_recovery,
                  database_path: database,
                  report_path: report_out,
                  utc_offset_seconds: utc_offset_seconds
                      .unwrap_or(settings.day_boundary.utc_offset_seconds),
                  operational_day_start_minutes: resolved_day_start,
                  quantum_seconds,
              })
              .map_err(|error| error.to_string())?;

              if json {
                  println!("{}", report.to_pretty_json()?);
              } else {
                  report.print_human();
              }
              Ok(())
          }

          pub fn print_completions(shell: &str) -> Result<(), String> {'''
          if function_anchor not in text:
              raise SystemExit('cli function insertion point not found')
          text = text.replace(function_anchor, function, 1)

          match_anchor = '''        Cli::Completions { shell } => {
          '''
          match_arm = '''        Cli::MigrateSqlite {
                      dry_run,
                      include_active_recovery,
                      database,
                      report_out,
                      utc_offset_seconds,
                      day_start_minutes,
                      quantum_seconds,
                      json,
                  } => {
                      if let Err(e) = migrate_sqlite(
                          dry_run,
                          include_active_recovery,
                          database,
                          report_out,
                          utc_offset_seconds,
                          day_start_minutes,
                          quantum_seconds,
                          json,
                      ) {
                          eprintln!("Error: {}", e);
                          std::process::exit(1);
                      }
                  }
                  Cli::Completions { shell } => {
          '''
          if match_anchor not in text:
              raise SystemExit('cli match insertion point not found')
          text = text.replace(match_anchor, match_arm, 1)
          cli.write_text(text)
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format and certify
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

      - name: Remove transport files
        run: |
          rm -f \
            .tmp/sqlite003.partaa \
            .tmp/sqlite003.partaa1 \
            .tmp/sqlite003.partaa2 \
            .tmp/sqlite003.partab \
            .tmp/sqlite003.partac \
            .tmp/sqlite003.partad \
            .tmp/sqlite003.partae
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/sqlite003-assemble.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(storage): add controlled SQLite migration command"
          git push origin HEAD:storage/003-controlled-migration-command
