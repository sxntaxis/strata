name: temporal002-source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  source:
    if: github.event.pull_request.head.ref == 'temporal/002-interval-boundaries'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: temporal/002-interval-boundaries
          fetch-depth: 0
      - name: Pack exact source tree
        run: |
          git archive --format=tar.gz --output=strata-temporal002-source.tar.gz HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: strata-temporal002-source
          path: strata-temporal002-source.tar.gz
          if-no-files-found: error
