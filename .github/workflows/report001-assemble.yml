name: report001-assemble

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.ref == 'report/001-ranges-active-ics-ordering'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: report/001-ranges-active-ics-ordering
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply implementation patch
        run: |
          base64 --decode tools/report001.patch.b64 | gzip --decompress > /tmp/report001.patch
          git apply --check /tmp/report001.patch
          git apply /tmp/report001.patch

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Commit certified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli.rs src/domain.rs src/sqlite/cli_runtime.rs
          git commit -m 'REPORT-001: make reports and exports truthful'
          git push origin HEAD:report/001-ranges-active-ics-ordering
