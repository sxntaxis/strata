name: schema-inventory

on:
  pull_request:
    paths:
      - '.github/workflows/schema-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory compatibility schema references
        run: |
          grep -RInE 'legacy_import|legacy_import_id|schema_migrations|MIGRATION_[1-9]|transition_storage_authority|sqlite_cli_activated_at_utc|CURRENT_SCHEMA_VERSION' src tests Cargo.toml || true
