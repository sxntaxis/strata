name: temporal001-assemble

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.ref == 'temporal/001-explicit-time-authority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: temporal/001-explicit-time-authority
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply documentation
        run: python tools/temporal001_docs.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Commit certified documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/TEMPORAL_AUTHORITY.md notebook/NOW.md notebook/work/ISSUE-RECONCILIATION-001.md notebook/work/RELIABILITY-001-persistence-and-audit-remediation.md
          git commit -m 'docs: record temporal authority and advance frontier'
          git push origin HEAD:temporal/001-explicit-time-authority
