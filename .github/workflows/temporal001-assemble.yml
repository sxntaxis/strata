name: temporal001-assemble

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.ref == 'temporal/001-explicit-time-authority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: temporal/001-explicit-time-authority
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply implementation
        run: python tools/temporal001_apply.py

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Commit certified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/temporal.rs src/domain.rs src/cli.rs src/app.rs src/app/report_state.rs src/sqlite/cli_runtime.rs tests/temporal_authority.rs
          git commit -m 'TEMPORAL-001: establish explicit time authority'
          git push origin HEAD:temporal/001-explicit-time-authority
