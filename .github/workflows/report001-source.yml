name: report001-source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  source:
    if: github.event.pull_request.head.ref == 'report/001-ranges-active-ics-ordering'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: report/001-ranges-active-ics-ordering
          fetch-depth: 0
      - name: Pack exact source tree
        run: git archive --format=tar.gz --output=strata-report001-source.tar.gz HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: strata-report001-source
          path: strata-report001-source.tar.gz
          if-no-files-found: error
