name: reconciliation001c1-identity-audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: reconciliation001c1-identity-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reconciliation/001c1-sqlite-category-lifecycle
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply identity preservation audit
        run: |
          python tools/reconciliation001c1-identity-audit.py
          python tools/reconciliation001c1-identity-proof.py

      - name: Remove temporary audit machinery
        run: |
          rm -f tools/reconciliation001c1-identity-audit.py
          rm -f tools/reconciliation001c1-identity-proof.py
          rm -f .github/workflows/reconciliation001c1-identity-audit.yml

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Commit clean audit corrections
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(category): preserve retired identity across lifecycle and bundles"
          git push origin HEAD:reconciliation/001c1-sqlite-category-lifecycle
