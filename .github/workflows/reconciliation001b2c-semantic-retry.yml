name: reconciliation001b2c-semantic-retry

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  semantic:
    if: github.head_ref == 'reconciliation/001b2c-clear-all-custody'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/001b2c-clear-all-custody
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply B2C semantic patch
        run: |
          python tools/reconciliation001b2c-semantic.py
          python tools/reconciliation001b2c-app-fix.py
          python tools/reconciliation001b2c-sqlite.py
          python tools/reconciliation001b2c-tests.py
          python tools/reconciliation001b2c-cleanup.py
      - name: Remove temporary machinery
        run: |
          rm -f tools/reconciliation001b2c-semantic.py
          rm -f tools/reconciliation001b2c-app-fix.py
          rm -f tools/reconciliation001b2c-sqlite.py
          rm -f tools/reconciliation001b2c-tests.py
          rm -f tools/reconciliation001b2c-cleanup.py
          rm -f .github/workflows/reconciliation001b2c-semantic.yml
          rm -f .github/workflows/reconciliation001b2c-semantic-retry.yml
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation-001b2c): make clear-all receipt governed"
          git push origin HEAD:reconciliation/001b2c-clear-all-custody
