name: interaction001c-fixup

on:
  push:
    branches:
      - interaction/001c-keymap-truth
    paths:
      - tools/interaction001c-fixup.py
      - .github/workflows/interaction001c-fixup.yml

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interaction/001c-keymap-truth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply semantic fixup
        run: python tools/interaction001c-fixup.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit clean fixup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(interaction-001c): close keymap truth gaps"
          git push origin HEAD:interaction/001c-keymap-truth
