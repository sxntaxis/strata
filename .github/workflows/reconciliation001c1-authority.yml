name: reconciliation001c1-authority

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: reconciliation001c1-authority
  cancel-in-progress: true

jobs:
  authority:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reconciliation/001c1-sqlite-category-lifecycle
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Promote lifecycle authority
        run: python tools/reconciliation001c1-authority.py

      - name: Remove temporary authority machinery
        run: |
          rm -f tools/reconciliation001c1-authority.py
          rm -f .github/workflows/reconciliation001c1-authority.yml

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Commit accepted authority
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(category): accept sqlite lifecycle authority"
          git push origin HEAD:reconciliation/001c1-sqlite-category-lifecycle
