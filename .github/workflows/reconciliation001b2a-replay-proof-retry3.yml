name: reconciliation001b2a-replay-proof-retry3

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  replay-proof:
    if: github.head_ref == 'reconciliation/001b2a-legacy-switch-receipts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/001b2a-legacy-switch-receipts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply replay proof refactor
        run: python tools/reconciliation001b2a-replay-proof.py
      - name: Correct proof-only assertions and palette
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app.rs')
          text = path.read_text()

          function = text.index('    fn failed_catalog_publication_retains_receipt_after_session_converges()')
          start = text.index('        let error = publish_legacy_switch_replay(', function)
          assert_start = text.index('        assert!(!error.is_empty());', start)
          old = text[start:assert_start]
          suffix = '\n        .unwrap_err();\n'
          if suffix not in old:
              raise SystemExit('unwrap_err suffix not found in failure assertion')
          call = old.removeprefix('        let error = ').removesuffix(suffix)
          new = (
              '        let error = match '
              + call
              + ' {\n'
              + '            Ok(_) => panic!("catalog publication unexpectedly succeeded"),\n'
              + '            Err(error) => error,\n'
              + '        };\n'
          )
          text = text[:start] + new + text[assert_start:]

          module = text.index('mod legacy_switch_replay_tests')
          category_fn = text.index('    fn category(id: u64, name: &str, description: &str) -> Category {', module)
          color = text.index('            color: Color::White,', category_fn)
          replacement = '''            color: if id == DRIFT_CATEGORY_ID.0 {
                Color::White
            } else {
                crate::constants::COLORS
                    [((id - 1) as usize) % crate::constants::COLORS.len()]
            },'''
          text = text[:color] + replacement + text[color + len('            color: Color::White,'):]
          path.write_text(text)
          PY
          rm -f .github/workflows/reconciliation001b2a-replay-proof-retry.yml
          rm -f .github/workflows/reconciliation001b2a-replay-proof-retry2.yml
          rm -f .github/workflows/reconciliation001b2a-replay-proof-retry3.yml
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit clean proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(reconciliation-001b2a): certify legacy switch replay kill points"
          git push origin HEAD:reconciliation/001b2a-legacy-switch-receipts
