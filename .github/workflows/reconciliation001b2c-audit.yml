name: reconciliation001b2c-audit

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'reconciliation/001b2c-clear-all-custody'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/001b2c-clear-all-custody
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply replay-integrity audit corrections
        run: |
          python tools/reconciliation001b2c-audit-1.py
          python tools/reconciliation001b2c-audit-2.py
          python tools/reconciliation001b2c-audit-3.py
      - name: Remove temporary audit machinery
        run: |
          rm -f tools/reconciliation001b2c-audit-1.py
          rm -f tools/reconciliation001b2c-audit-2.py
          rm -f tools/reconciliation001b2c-audit-3.py
          rm -f .github/workflows/reconciliation001b2c-audit.yml
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit clean audit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation-001b2c): bind deterministic clear-all replay"
          git push origin HEAD:reconciliation/001b2c-clear-all-custody
