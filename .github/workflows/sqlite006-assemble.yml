name: sqlite006-assemble

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: storage/006-cli-authority-activation
          fetch-depth: 0

      - name: Wire authority and CLI boundaries
        run: |
          python3 tools/sqlite006_recover.py
          python3 /tmp/sqlite006-wire.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format and certify
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

      - name: Commit certified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "SQLITE-006: activate SQLite CLI authority"
          git push origin HEAD:storage/006-cli-authority-activation
