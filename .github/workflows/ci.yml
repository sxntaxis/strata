name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reconciliation/002-close-all-issues
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply complete profile authority
        run: python3 .github/scripts/apply_issue_15.py

      - name: Integrate complete profile authority
        run: python3 .github/scripts/fix_issue_15.py

      - name: Format
        run: cargo fmt --all

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Full suite
        run: cargo test --all-features

      - name: Publish clean product commit
        run: |
          rm .github/issue15-trigger.txt
          rm .github/scripts/apply_issue_15.py .github/scripts/fix_issue_15.py
          cat > .github/workflows/ci.yml <<'YAML'
          name: ci

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            checks:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Rust
                  uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy

                - name: Cache cargo
                  uses: Swatinem/rust-cache@v2

                - name: Check formatting
                  run: cargo fmt --all -- --check

                - name: Run clippy
                  run: cargo clippy --all-targets --all-features -- -D warnings

                - name: Run tests
                  run: cargo test --all-features
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(authority): isolate complete profile state"
          git push origin HEAD:reconciliation/002-close-all-issues
