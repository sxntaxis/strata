name: ci

on:
  pull_request:
  push:
    branches: [audit/006-legacy-publication-races]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/006-legacy-publication-races

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Inject publication race proofs
        run: python3 .github/scripts/inject_publication_race_tests.py

      - name: Format injected tests
        run: cargo fmt --all

      - name: Run publication race proofs
        run: cargo test publication_race_tests --all-features -- --test-threads=1 --nocapture
