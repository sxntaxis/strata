name: reconciliation001c1-wire

on:
  push:
    branches: [reconciliation/001c1-sqlite-category-lifecycle]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: reconciliation001c1-wire
  cancel-in-progress: false

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reconciliation/001c1-sqlite-category-lifecycle
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply lifecycle wiring
        run: python tools/reconciliation001c1-wire.py

      - name: Remove temporary machinery
        run: |
          rm -f tools/reconciliation001c1-wire.py
          rm -f .github/workflows/reconciliation001c1-wire.yml

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Commit clean implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(category): establish sqlite lifecycle authority"
          git push origin HEAD:reconciliation/001c1-sqlite-category-lifecycle
