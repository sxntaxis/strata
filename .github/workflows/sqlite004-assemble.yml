name: sqlite004-assemble

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sqlite004-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assemble:
    if: github.event.pull_request.head.ref == 'storage/004-repository-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: storage/004-repository-parity
          fetch-depth: 0

      - name: Wire repository module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('src/sqlite/repository.rs')
          if not module.exists():
              raise SystemExit('repository module is missing')

          path = Path('src/sqlite.rs')
          text = path.read_text()
          declaration = 'mod repository;\n'
          if declaration not in text:
              anchor = 'mod migration_command;\n'
              if anchor not in text:
                  raise SystemExit('sqlite module anchor not found')
              text = text.replace(anchor, anchor + declaration, 1)
              path.write_text(text)
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format and certify
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

      - name: Remove assembly workflow
        run: rm -f .github/workflows/sqlite004-assemble.yml

      - name: Commit certified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SQLITE-004: complete repository boundary and parity tests"
          git push origin HEAD:storage/004-repository-parity
