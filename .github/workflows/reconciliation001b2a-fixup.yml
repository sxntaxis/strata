name: reconciliation001b2a-fixup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fixup:
    if: github.event.pull_request.head.ref == 'reconciliation/001b2a-legacy-switch-receipts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/001b2a-legacy-switch-receipts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply receipt integrity validation
        run: python tools/reconciliation001b2a-fixup.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit clean fixup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation-001b2a): validate switch receipt integrity"
          git push origin HEAD:reconciliation/001b2a-legacy-switch-receipts
