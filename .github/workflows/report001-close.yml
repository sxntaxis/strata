name: report001-close

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  close:
    if: github.event.pull_request.head.ref == 'report/001-ranges-active-ics-ordering'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout REPORT-001 branch
        uses: actions/checkout@v4
        with:
          ref: report/001-ranges-active-ics-ordering
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply durable authority closure
        run: python tools/report001-close.py

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Commit clean permanent tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'REPORT-001: record report and export authority'
          git push origin HEAD:report/001-ranges-active-ics-ordering
