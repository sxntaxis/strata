name: prune-file-runtime

on:
  pull_request:
    paths:
      - '.github/workflows/prune-file-runtime.yml'
      - '.github/scripts/prune_file_runtime.py'
      - '.github/scripts/prune_file_runtime_cleanup.py'
      - '.github/scripts/prune_receipt_fields.py'
      - '.github/scripts/prune_file_runtime_final.py'

permissions:
  contents: write

concurrency:
  group: prune-file-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Prune file runtime
        run: |
          python3 .github/scripts/prune_file_runtime.py
          python3 .github/scripts/prune_file_runtime_cleanup.py
          python3 .github/scripts/prune_receipt_fields.py
          python3 .github/scripts/prune_file_runtime_final.py
      - name: Format
        run: cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full suite
        run: cargo test --all-features
      - name: Publish clean prune commit
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/scripts/prune_file_runtime.py
          rm -f .github/scripts/prune_file_runtime_cleanup.py
          rm -f .github/scripts/prune_receipt_fields.py
          rm -f .github/scripts/prune_file_runtime_final.py
          rm -f .github/workflows/prune-file-runtime.yml
          rm -f .github/workflows/sqlite-only-prune-inventory.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: delete file-backed runtime compatibility'
          git push origin HEAD:$BRANCH
