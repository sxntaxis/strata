name: report001-ics-parse

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  parse:
    if: github.event.pull_request.head.ref == 'report/001-ranges-active-ics-ordering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report/001-ranges-active-ics-ordering
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate authoritative ICS
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/data"
          export XDG_STATE_HOME="$RUNNER_TEMP/state"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          mkdir -p "$XDG_DATA_HOME/strata" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME"
          printf 'id,name,description,color_index,karma_effect\n1,Work,,0,1\n' > "$XDG_DATA_HOME/strata/categories.csv"
          cargo run --quiet -- start client-a --category Work --desc 'line one, semi; slash\\line two'
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          path = os.path.join(os.environ['XDG_STATE_HOME'], 'strata', 'active_session.json')
          data = json.load(open(path))
          data['start_time'] = (datetime.now(timezone.utc) - timedelta(seconds=5)).isoformat()
          json.dump(data, open(path, 'w'))
          PY
          cargo run --quiet -- export --format ics > "$RUNNER_TEMP/report.ics"
          grep -q 'BEGIN:VEVENT' "$RUNNER_TEMP/report.ics"
      - name: Parse with icalendar and ics.py
        run: |
          python -m pip install --quiet icalendar ics
          python - <<'PY'
          import os
          from icalendar import Calendar
          from ics import Calendar as IcsCalendar
          path = os.path.join(os.environ['RUNNER_TEMP'], 'report.ics')
          raw = open(path, 'rb').read()
          first = Calendar.from_ical(raw)
          assert len([c for c in first.walk() if c.name == 'VEVENT']) == 1
          second = IcsCalendar(raw.decode('utf-8'))
          assert len(second.events) == 1
          event = next(iter(second.events))
          assert event.begin is not None and event.end is not None
          PY
