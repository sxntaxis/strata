name: reconciliation001c2-process-proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: reconciliation001c2-process-proof
  cancel-in-progress: true

jobs:
  proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reconciliation/001c2-legacy-category-lifecycle
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add process proof
        run: python tools/reconciliation001c2-process-proof.py

      - name: Remove temporary proof machinery
        run: |
          rm -f tools/reconciliation001c2-process-proof.py
          rm -f .github/workflows/reconciliation001c2-process-proof.yml

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Focused PTY proof
        run: cargo test --test sqlite_cli_authority lifecycle_overlay_applies_only_the_live_revision_bound_phrase -- --nocapture

      - name: Full suite
        run: cargo test --all-targets --all-features

      - name: Commit clean proof
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(category): prove lifecycle interaction through PTY"
          git push origin HEAD:reconciliation/001c2-legacy-category-lifecycle
