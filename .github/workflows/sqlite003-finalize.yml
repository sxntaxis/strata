name: sqlite003-finalize

on:
  push:
    branches:
      - storage/003-controlled-migration-command
    paths:
      - .github/workflows/sqlite003-finalize.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: storage/003-controlled-migration-command
          fetch-depth: 0

      - name: Verify detached recovery contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('src/sqlite/migration_command.rs').read_text()
          required = [
              'self.source_summary.active_session_present || self.source_summary.checkpoint_present',
              'plan.summary().active_session_present || plan.summary().checkpoint_present',
              'fn detached_checkpoint_requires_explicit_opt_in()',
          ]
          for fragment in required:
              if text.count(fragment) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {fragment}')
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format and certify
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

      - name: Remove temporary workflow
        run: rm -f .github/workflows/sqlite003-finalize.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(storage): remove SQLITE-003 finalizer"
          git push origin HEAD:storage/003-controlled-migration-command
