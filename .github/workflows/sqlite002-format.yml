name: sqlite002-format

on:
  push:
    branches:
      - storage/002-legacy-import-verification
    paths:
      - .github/workflows/sqlite002-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: storage/002-legacy-import-verification
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sqlite.rs src/sqlite/legacy_import.rs
          git commit -m "style(storage): format legacy importer"
          git push origin HEAD:storage/002-legacy-import-verification
