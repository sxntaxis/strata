name: current-schema

on:
  pull_request:
    paths:
      - '.github/workflows/current-schema.yml'
      - '.github/scripts/apply_current_schema.py'
      - '.github/scripts/normalize_current_schema_script.py'
      - '.github/scripts/cleanup_current_schema.py'

permissions:
  contents: write

concurrency:
  group: current-schema-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Apply current schema
        run: |
          python3 .github/scripts/normalize_current_schema_script.py
          python3 .github/scripts/apply_current_schema.py
          python3 .github/scripts/cleanup_current_schema.py
      - name: Format
        run: cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full suite
        run: cargo test --all-features
      - name: Publish clean schema commit
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/scripts/apply_current_schema.py
          rm -f .github/scripts/normalize_current_schema_script.py
          rm -f .github/scripts/cleanup_current_schema.py
          rm -f .github/workflows/current-schema.yml
          rm -f .github/workflows/schema-inventory.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: reset SQLite to one current schema'
          git push origin HEAD:$BRANCH
