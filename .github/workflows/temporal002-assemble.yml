name: temporal002-cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'temporal/002-interval-boundaries'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: temporal/002-interval-boundaries
          fetch-depth: 0

      - name: Remove assembly artifacts
        run: |
          rm -f TEMPORAL-002.md
          rm -f tools/temporal002.patch.b64.*
          rm -f tools/temporal002_fix.py

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A TEMPORAL-002.md tools
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'TEMPORAL-002: remove assembly artifacts'
          git push origin HEAD:temporal/002-interval-boundaries
