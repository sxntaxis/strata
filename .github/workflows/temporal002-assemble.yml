name: temporal002-assemble

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.ref == 'temporal/002-interval-boundaries'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: temporal/002-interval-boundaries
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply implementation patch
        run: |
          sha256sum tools/temporal002.patch.b64.*
          cat tools/temporal002.patch.b64.* | base64 --decode | gzip --decompress > /tmp/temporal002.patch
          git apply --check /tmp/temporal002.patch
          git apply /tmp/temporal002.patch
          python tools/temporal002_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Commit certified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m 'TEMPORAL-002: allocate interval boundaries honestly'
          git push origin HEAD:temporal/002-interval-boundaries
