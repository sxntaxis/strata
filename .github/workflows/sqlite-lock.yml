name: sqlite-lock

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/sqlite-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve SQLite from the verified main lockfile
        run: |
          git fetch origin main
          git checkout origin/main -- Cargo.lock
          cargo check --all-targets --all-features

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(storage): lock SQLite dependency graph"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
