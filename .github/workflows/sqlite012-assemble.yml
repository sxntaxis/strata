name: sqlite012-refine

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  refine:
    if: github.event.pull_request.head.ref == 'storage/012-interchange-validation-legacy-disposition'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: storage/012-interchange-validation-legacy-disposition
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply closure refinements
        run: python tools/sqlite012_refine.py

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Commit certified refinements
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli.rs src/sqlite/legacy_disposition.rs src/sqlite/closure_tests.rs
          git commit -m 'SQLITE-012: harden closure custody contracts'
          git push origin HEAD:storage/012-interchange-validation-legacy-disposition
