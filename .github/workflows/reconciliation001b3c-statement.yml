name: reconciliation001b3c-statement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  statement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reconciliation/001b3c-visible-recovery-cutoff
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply visible recovery statement
        run: python tools/reconciliation001b3c-statement.py

      - name: Remove temporary machinery
        run: |
          rm -f tools/reconciliation001b3c-statement.py
          rm -f .github/workflows/reconciliation001b3c-statement.yml

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation-001b3c): expose deterministic recovery cutoff"
          git push origin HEAD:reconciliation/001b3c-visible-recovery-cutoff
