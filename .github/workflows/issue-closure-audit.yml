name: issue-closure-audit

on:
  push:
    branches:
      - reconciliation/002-close-all-issues
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  active-draft-correction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/002-close-all-issues
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Normalize transform staging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_issue_22.py')
          text = path.read_text()
          start = text.index('# Emergency serialization.\n')
          end = text.index('# Direct calls in this file', start)
          text = text[:start] + text[end:]
          text = text.replace('"palette fresh draft")', '"palette fresh draft", count=2)')
          path.write_text(text)
          PY
      - name: Apply issue 22 correction
        run: python3 .github/scripts/apply_issue_22.py
      - name: Integrate active draft ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app.rs')
          text = path.read_text()
          old = '#[derive(Clone, Copy, Debug, PartialEq, Eq)]\nenum QueuedMutation {'
          new = '#[derive(Clone, Debug, PartialEq, Eq)]\nenum QueuedMutation {'
          if text.count(old) != 1:
              raise SystemExit('queued mutation derive marker missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/app/event_handlers.rs')
          text = path.read_text()
          old = '    keybindings::{Action, InputContext},\n};'
          new = '    keybindings::{Action, InputContext},\n    sqlite,\n};'
          if text.count(old) != 1:
              raise SystemExit('event handler crate import marker missing')
          text = text.replace(old, new, 1)
          old = 'use super::{App, PaletteCommand, QueuedMutation, ui_helpers};'
          new = '''use super::{
    App, PaletteCommand, PersistenceOperation, QueuedMutation, RecoveryAction, ui_helpers,
};'''
          if text.count(old) != 1:
              raise SystemExit('event handler app import marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full suite
        run: cargo test --all-features
      - name: Publish clean product commit
        run: |
          rm .github/scripts/apply_issue_22.py
          rm .github/workflows/issue22-transform.yml
          rm .github/workflows/issue22-transform-v2.yml
          rm .github/workflows/issue-closure-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(domain): separate active draft from layer metadata"
          git push origin HEAD:reconciliation/002-close-all-issues
