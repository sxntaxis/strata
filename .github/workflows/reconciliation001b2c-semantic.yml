name: reconciliation001b2c-semantic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  semantic:
    if: github.head_ref == 'reconciliation/001b2c-clear-all-custody'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconciliation/001b2c-clear-all-custody
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply semantic and receipt pass
        run: python tools/reconciliation001b2c-semantic.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Commit clean semantic pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation-001b2c): make clear-all non-destructive and receipt-governed"
          git push origin HEAD:reconciliation/001b2c-clear-all-custody
