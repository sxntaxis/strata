name: authority001-assemble

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.ref == 'authority/001-fail-closed-configuration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: authority/001-fail-closed-configuration
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply implementation
        run: python tools/authority001_apply.py

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Commit certified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/cli.rs src/app.rs src/keybindings.rs tests/config_authority.rs
          git commit -m 'AUTHORITY-001: fail closed on invalid configuration'
          git push origin HEAD:authority/001-fail-closed-configuration
