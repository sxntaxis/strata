[package]
name = "strata"
version = "0.7.7"
edition = "2024"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
csv = "1.3"
directories = "5.0"
thiserror = "1.0"
itertools = "0.12"
rusqlite = { version = "0.39", features = ["bundled"] }

[dev-dependencies]
libc = "0.2"

[features]
default = ["cli"]
cli = []
tui = []

[profile.dev]
# `testingcheats` is intentionally debug-only, so the interactive performance
# lab must not run the Classic cellular solver at Cargo's unoptimized default.
# Debug assertions remain enabled; only code generation is optimized.
opt-level = 2

[profile.release]
strip = true
lto = true
codegen-units = 1
