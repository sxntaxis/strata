schema_version = 2
name = "Strata"
lifecycle = "active"
locale = "en"
verified_on = "2026-08-09"
languages = ["rust"]
interfaces = ["tui", "cli"]
storage = ["sqlite", "csv-interchange"]

[authority]
canonical = "Accepted docs, Rust source, embedded tests, CI, and verified runtime behavior"
projections = ["terminal UI", "CLI reports", "CSV/JSON/ICS exports", "sediment visualization"]

[commands]
check = "cargo fmt --all -- --check && cargo clippy --all-targets --all-features -- -D warnings"
test = "cargo test --all-features"
smoke = "cargo run -- --help"

[agent]
max_lines = 220

[architecture]
source_roots = ["src"]
warn_file_lines = 500

[[components]]
name = "runtime"
path = "src"
status = "supported"
rationale = "Rust application containing the TUI, CLI, domain, repositories, sediment simulation, and embedded tests"
remove_by = ""

[[components]]
name = "sqlite-authority"
path = "src/sqlite"
status = "supported"
rationale = "Single current SQLite persistence, runtime coordination, maintenance, recovery, and portable interchange"
remove_by = ""

[[components]]
name = "tui"
path = "src/app.rs"
status = "supported"
rationale = "Primary continuous-ledger and sediment interaction surface"
remove_by = ""

[[components]]
name = "cli"
path = "src/cli.rs"
status = "supported"
rationale = "Non-interactive lifecycle, reporting, export, and maintenance interface"
remove_by = ""

[[components]]
name = "sediment"
path = "src/sand"
status = "supported"
rationale = "Falling-sand simulation and Braille-cell rendering"
remove_by = ""

[[components]]
name = "notebook"
path = "notebook"
status = "supported"
rationale = "Repository-local product memory, decisions, evidence, research, and current frontier"
remove_by = ""
